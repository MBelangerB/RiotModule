# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Bedy90 - Riot Module - PullRequest Check'
on:
  pull_request:
    branches: [ "dev", "prod" ]

  # Manual action
  workflow_dispatch:

permissions:
  contents: read
  # Write permissions for pull-requests are required for using the `comment-summary-in-pr` option, comment out if you aren't using this option
  pull-requests: write
  security-events: write

jobs:   
  # -----------------------------------------
  # Linter validation
  # -----------------------------------------    
  eslint-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: setup
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          scope-name: '@bedy90'

      - name: Run lint
        run: npm run eslint
        continue-on-error: false  # Arrête le workflow si le lint échoue      

  # -----------------------------------------
  # Build validation
  # -----------------------------------------      
  build:
    runs-on: ubuntu-latest
    needs: eslint-review
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: setup
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          scope-name: '@bedy90'

      - name: Run build tsup
        run: npm run build:tsup_pack
        continue-on-error: false  # Arrête le workflow si le build échoue

  # -----------------------------------------
  # NPM AUDIT
  # -----------------------------------------
  audit_solution:
    runs-on: ubuntu-latest
    needs: [eslint-review] #, build]
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - id: setup
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          scope-name: '@bedy90'
 
      # - name: Run audit
      #   run: npm audit --audit-level=high || true
      #   continue-on-error: true  # Arrête le workflow si le build échoue

      - name: Run npm audit and save result
        id: audit
        run: |
          npm audit --json > audit-result.json || true
  
          - name: Comment on Pull Request with audit results
          uses: actions/github-script@v6
          if: steps.audit.outcome == 'success' || steps.audit.outcome == 'failure'
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
              const fs = require('fs');
              const audit = JSON.parse(fs.readFileSync('audit-result.json', 'utf8'));
              const vulnerabilities = audit.metadata.vulnerabilities || {};
              
              // Exemple simple pour construire le message
              let message = '### NPM Audit report\n\n';
              message += `Critical: ${vulnerabilities.critical || 0}\n`;
              message += `High: ${vulnerabilities.high || 0}\n`;
              message += `Moderate: ${vulnerabilities.moderate || 0}\n`;
              message += `Low: ${vulnerabilities.low || 0}\n\n`;
        
              if ((vulnerabilities.critical || 0) > 0) {
                message += '**Attention:** Des vulnérabilités critiques ont été détectées! 🚨\n';
              } else {
                message += 'Aucune vulnérabilité critique détectée. ✅\n';
              }
        
              // Chercher un ancien commentaire pour le mettre à jour au lieu de spammer
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('### NPM Audit report'));
        
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: message,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: message,
                });
              }         

  # -----------------------------------------
  # Outdated validation
  # -----------------------------------------
  outdated_package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: setup
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          scope-name: '@bedy90'

      - name: Check outdated dependencies
        id: outdated
        run: |
          npm outdated --json > outdated.json || true          
        shell: bash -e {0}
        continue-on-error: true  # Continuer en cas d'erreur pour diagnostiquer

      - name: Install dependencies
        run: npm install mustache
  
      - name: Comment on Pull Request
        if: steps.outdated.outcome == 'success'
        uses: actions/github-script@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read JSON
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.json', 'utf8');
            const result = JSON.parse(outdated);

            // Prepare JSON data
            const packageList = {
              data: []
            };

            Object.keys(result).forEach(depName => {
                const depInfo = result[depName];          
                packageList.data.push({name: depName, current: depInfo.current, wanted: depInfo.wanted, latest: depInfo.latest })
            });

            // Read template
            const templatePath = '.github/template/outdated.md';
            const templateFile = fs.readFileSync(templatePath, 'utf8');
            // const commentBody = renderTemplate(templateFile, packageList.data)

            const Mustache = require('mustache');
            const mustacheCommentBody = Mustache.render(templateFile, packageList);

            // Trouver le commentaire existant
            const existingComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            const commentToUpdate = existingComments.data.find(c => c.user.type === 'Bot' && c.body.includes('<!-- outdated-comment -->'))
      
            try {
              if (commentToUpdate) {
                // Mettre à jour le commentaire existant
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: commentToUpdate.id,
                  body: mustacheCommentBody
                })
              } else {
                // Créer un nouveau commentaire
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: mustacheCommentBody
                })
              }
            } catch (error) {
              console.error('Error commenting on pull request:', error);
              throw error;
            }